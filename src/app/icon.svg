<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Squircle Background -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  
  <!-- Subtle Telemetry Radar Ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="rgba(52,211,153,0.25)" stroke-width="1" />

  <!-- Mouse Pointer / Telemetry Arrow -->
  <path d="M10 8 L22 15 L16.5 16.5 L14.5 22 Z" fill="url(#cursorGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="0.75" stroke-linejoin="round" />
  
  <!-- Pulse Dot at click origin -->
  <circle cx="21" cy="15" r="1.5" fill="#38bdf8" />
</svg>
